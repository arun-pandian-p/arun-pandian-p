name: Metrics

# Generates SVG metrics cards into assets/metrics/ once a day.
#
# SETUP (one-time):
#   1. Go to GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens
#   2. Create a token with scope: read:user  (no write needed for public data)
#   3. Add it to this repo → Settings → Secrets → Actions → New repository secret
#      Name: METRICS_TOKEN
#   4. Enable "Read and write permissions" under Settings → Actions → General → Workflow permissions
#
# To unlock LeetCode stats: uncomment the leetcode job and set plugin_leetcode_user.

on:
  schedule:
    - cron: "30 1 * * *"     # daily at 01:30 UTC
  workflow_dispatch:          # run manually from the Actions tab

permissions:
  contents: write

jobs:
  # ── 1. Starred topics ────────────────────────────────────────────────────
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: assets/metrics/topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0        # 0 = show all

  # ── 2. Featured repositories card ────────────────────────────────────────
  featured:
    runs-on: ubuntu-latest
    needs: topics             # sequential to avoid push conflicts
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: assets/metrics/featured-repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: >-
            arun-pandian-p/IT-Helpdesk-and-incident-Management-System,
            arun-pandian-p/xai-seizure-prediction-dashboard,
            arun-pandian-p/Zappy,
            arun-pandian-p/Ap-Desktop,
            arun-pandian-p/developer.arunpandian.online

  # ── 3. Star-list languages ───────────────────────────────────────────────
  starlists:
    runs-on: ubuntu-latest
    needs: featured
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: assets/metrics/starlists-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 8
          plugin_starlists_limit_repositories: 0

  # ── 4. LeetCode stats (uncomment after adding your username) ─────────────
