<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#BF91F3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDAE" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="850" height="240" rx="12" fill="#0D1117" stroke="#1F2937" stroke-width="1.5"/>
  <text x="50%" y="45%" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="22" fill="#70A5FD">
    🧱 3D Contribution Graph Initializing...
  </text>
  <text x="50%" y="62%" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" fill="#9CA3AF">
    Automatically generated by GitHub Actions on first workflow run
  </text>
  <circle cx="425" cy="180" r="6" fill="url(#grad)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
