name: Metrics

# Uses lowlighter/metrics to render SVG cards into assets/metrics/.
# Requires a repository secret METRICS_TOKEN (a GitHub personal access token).
# See README "Metrics setup" notes in the chat for token scopes.

on:
  schedule:
    - cron: "30 1 * * *"     # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 12

  featured:
    runs-on: ubuntu-latest
    needs: topics            # run one after another to avoid commit conflicts
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/featured-repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: >-
            arun-pandian-p/Zappy,
            arun-pandian-p/Ap-Desktop,
            arun-pandian-p/IT-Helpdesk-and-incident-Management-System

  starlists:
    runs-on: ubuntu-latest
    needs: featured
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/starlists-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes

  # --- Optional: enable once you add your LeetCode username ---
